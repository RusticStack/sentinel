[package]
name = "sentinel-mail"
description = "Durable email delivery: a bounded Resend HTTPS client and the outbox lane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Lets a test point the client at a local server over plain HTTP. Enabled only
# through dev-dependencies, never by a production build or by configuration.
test-endpoint = []

[dependencies]
sentinel-auth = { path = "../sentinel-auth" }
sentinel-core = { path = "../sentinel-core" }
sentinel-store = { path = "../sentinel-store" }
serde_json = "1.0"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[dev-dependencies]
sentinel-mail = { path = ".", features = ["test-endpoint"] }
tempfile = "3.20"

[lints]
workspace = true
