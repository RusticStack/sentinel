[package]
name = "sentinel-link"
description = "Worker link: generated TLS identity, mutually authenticated sessions, framing, hello/heartbeat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# The controller's side: listener, admission, fleet and dispatcher over the store.
controller = ["dep:sentinel-store"]

[dependencies]
blake3 = "1.8"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.15"
sentinel-auth = { path = "../sentinel-auth" }
sentinel-core = { path = "../sentinel-core" }
sentinel-protocol = { path = "../sentinel-protocol" }
sentinel-store = { path = "../sentinel-store", optional = true }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
sentinel-link = { path = ".", features = ["controller"] }
sentinel-pipeline = { path = "../sentinel-pipeline" }
sentinel-store = { path = "../sentinel-store" }
tempfile = "3.20"

[lints]
workspace = true
