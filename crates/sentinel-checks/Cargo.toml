[dev-dependencies]
sentinel-auth = { path = "../sentinel-auth" }
sentinel-pipeline = { path = "../sentinel-pipeline" }
sentinel-protocol = { path = "../sentinel-protocol" }
serde_json = "1.0"
tempfile = "3.20"
time = { version = "0.3", features = ["formatting"] }

[lints]
workspace = true
