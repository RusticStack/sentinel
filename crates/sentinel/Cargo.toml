[package]
name = "sentinel"
description = "Performance-first, self-hosted CI for humans and coding agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
server = ["dep:ctrlc", "dep:serde", "dep:toml"]
worker = ["dep:ctrlc", "dep:serde", "dep:toml"]

[dependencies]
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }

[target.'cfg(target_os = "linux")'.dependencies]
ctrlc = { version = "3.4", optional = true, features = ["termination"] }
serde = { version = "1.0", optional = true, features = ["derive"] }
toml = { version = "1.0", optional = true, default-features = false, features = ["std", "parse", "serde"] }

[dev-dependencies]
tempfile = "3.20"

[lints]
workspace = true
