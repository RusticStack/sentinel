[package]
name = "sentinel"
description = "Performance-first, self-hosted CI for humans and coding agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
server = ["dep:sentinel-auth", "dep:sentinel-core", "dep:sentinel-store", "dep:sentinel-link", "sentinel-link/controller", "dep:sentinel-protocol", "dep:ctrlc", "dep:serde", "dep:toml", "dep:tracing", "dep:tracing-subscriber", "dep:uuid"]
worker = ["dep:sentinel-auth", "dep:sentinel-core", "dep:sentinel-link", "dep:sentinel-protocol", "dep:sentinel-worker", "dep:ctrlc", "dep:serde", "dep:toml", "dep:tracing", "dep:tracing-subscriber", "dep:uuid"]

[dependencies]
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
sentinel-pipeline = { path = "../sentinel-pipeline" }
serde_json = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
sentinel-auth = { path = "../sentinel-auth", optional = true }
sentinel-core = { path = "../sentinel-core", optional = true }
sentinel-store = { path = "../sentinel-store", optional = true }
sentinel-link = { path = "../sentinel-link", optional = true }
sentinel-protocol = { path = "../sentinel-protocol", optional = true }
sentinel-worker = { path = "../sentinel-worker", optional = true }
ctrlc = { version = "3.4", optional = true, features = ["termination"] }
serde = { version = "1.0", optional = true, features = ["derive"] }
toml = { version = "1.0", optional = true, default-features = false, features = ["std", "parse", "serde"] }
tracing = { version = "0.1", optional = true, default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["std", "fmt", "json", "registry"] }
uuid = { version = "1.24", optional = true, features = ["v4"] }

[dev-dependencies]
tempfile = "3.20"
serde_json = "1.0"

[lints]
workspace = true
