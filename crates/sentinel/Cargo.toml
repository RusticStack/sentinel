[package]
name = "sentinel"
description = "Performance-first, self-hosted CI for humans and coding agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
server = ["dep:sentinel-core", "dep:sentinel-store", "dep:sentinel-link", "sentinel-link/controller", "dep:sentinel-api", "dep:sentinel-github", "dep:sentinel-intake", "dep:sentinel-checks", "dep:ctrlc", "dep:toml", "dep:tracing", "dep:tracing-subscriber", "dep:uuid"]
worker = ["dep:sentinel-core", "dep:sentinel-link", "dep:sentinel-worker", "dep:ctrlc", "dep:toml", "dep:tracing", "dep:tracing-subscriber", "dep:uuid"]

[dependencies]
blake3 = "1.8"
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "env"] }
form_urlencoded = "1.2"
sentinel-auth = { path = "../sentinel-auth" }
sentinel-pipeline = { path = "../sentinel-pipeline" }
sentinel-protocol = { path = "../sentinel-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
sentinel-github = { path = "../sentinel-github", optional = true }
sentinel-intake = { path = "../sentinel-intake", optional = true }
sentinel-checks = { path = "../sentinel-checks", optional = true }
sentinel-api = { path = "../sentinel-api", optional = true }
sentinel-core = { path = "../sentinel-core", optional = true }
sentinel-store = { path = "../sentinel-store", optional = true }
sentinel-link = { path = "../sentinel-link", optional = true }
sentinel-worker = { path = "../sentinel-worker", optional = true }
ctrlc = { version = "3.4", optional = true, features = ["termination"] }
toml = { version = "1.0", optional = true, default-features = false, features = ["std", "parse", "serde"] }
tracing = { version = "0.1", optional = true, default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = ["std", "fmt", "json", "registry"] }
uuid = { version = "1.24", optional = true, features = ["v4"] }

[dev-dependencies]
ring = "0.17"
sentinel-api = { path = "../sentinel-api" }
sentinel-core = { path = "../sentinel-core" }
sentinel-github = { path = "../sentinel-github", features = ["fake"] }
sentinel-link = { path = "../sentinel-link", features = ["controller"] }
sentinel-store = { path = "../sentinel-store" }
tempfile = "3.20"
serde_json = "1.0"
time = { version = "0.3", features = ["formatting"] }

# The browser opener test plays the opener it launches, so it has its own
# `main` instead of the libtest harness.
[[test]]
name = "browser"
path = "tests/browser.rs"
harness = false

[lints]
workspace = true
