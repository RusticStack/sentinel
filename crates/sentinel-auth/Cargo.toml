[package]
name = "sentinel-auth"
description = "Local password hashing, opaque session secrets, cookie and CSRF policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash", "zeroize"] }
base64 = "0.23"
blake3 = { version = "1.8", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "rand_core", "zeroize"] }
getrandom = "0.4"
sha2 = "0.11"
totp-rs = { version = "6.0", default-features = false, features = ["alloc", "otpauth"] }
zeroize = "1.8"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "3.20"

[lints]
workspace = true
