[package]
name = "sentinel-auth"
description = "Local password hashing, opaque session secrets, cookie and CSRF policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash", "zeroize"] }
blake3 = "1.8"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "rand_core"] }
getrandom = "0.4"
totp-rs = { version = "6.0", default-features = false, features = ["alloc", "otpauth"] }

[lints]
workspace = true
