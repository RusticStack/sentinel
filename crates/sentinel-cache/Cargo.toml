[package]
name = "sentinel-cache"
description = "Worker-local cache metadata: scope paths, sealed-generation manifests, explainable hit/miss reasons"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
sentinel-core = { path = "../sentinel-core" }
sentinel-pipeline = { path = "../sentinel-pipeline" }
sentinel-protocol = { path = "../sentinel-protocol" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.20"

[lints]
workspace = true
