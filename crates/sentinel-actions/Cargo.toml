[package]
name = "sentinel-actions"
description = "Worker-host endpoint serving the Actions cache and artifact services to one runner sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.15"
sentinel-cache = { path = "../sentinel-cache" }
sentinel-core = { path = "../sentinel-core" }
sentinel-protocol = { path = "../sentinel-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.20"

[lints]
workspace = true
