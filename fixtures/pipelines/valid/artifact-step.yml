schema: 1
on: [push]
jobs:
  build:
    image: alpine:3
    steps:
      - { id: compile, run: make }
      - { id: package, run: make dist }
    artifacts:
      - name: object-files
        paths: [build/**]
        when: step:compile
      - name: release
        paths: [dist/app]
        when: step:package
        required: true
        retain: 30d
      - name: last-resort
        paths: [dist/**]
        when: always
