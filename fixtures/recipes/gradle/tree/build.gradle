plugins { id 'java' }

repositories {
    maven { url = uri('file:///workspace/m2-mirror') }
}

dependencies {
    implementation 'com.acme:k07a:1.0.0'
    implementation 'com.acme:k07b:1.0.0'
}

dependencyLocking { lockAllConfigurations() }

jar { manifest { attributes 'Main-Class': 'com.acme.App' } }

tasks.register('copyDeps', Copy) {
    from configurations.runtimeClasspath
    into 'build/deps'
}
build.dependsOn copyDeps
