# The gson `build.yml` shape from docs/pilot-repositories.md: a JDK matrix with an
# include and an exclude, a container job, a service container and a published artifact.
name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container: eclipse-temurin:21-jdk
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        java: [17, 21, 25]
        experimental: [false]
        include:
          - java: 25
            experimental: true
        exclude:
          - experimental: true
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: gson
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: mvn verify javadoc:jar -B
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: gson-${{ matrix.java }}
          path: |
            target/*.jar
            target/site/apidocs
