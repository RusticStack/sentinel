# The cli `go.yml` shape from docs/pilot-repositories.md: a matrix build across Linux,
# Windows and macOS, and an integration job that needs a repository secret.
name: go
on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: go test -race -tags=integration ./...
      - run: go build ./cmd/gh
      - run: go build -tags=ghdebug ./cmd/gh
        if: runner.os == 'Linux'
  integration-tests:
    name: integration tests
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Attestation command tests
        run: go test ./pkg/cmd/attestation/...
