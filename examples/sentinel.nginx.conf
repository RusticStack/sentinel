# nginx in front of Sentinel (docs/deployment.md#tls-and-a-reverse-proxy).
# Drop it into /etc/nginx/conf.d/. It terminates TLS for the public origin and
# sends everything to sentinel-web on loopback, which forwards the API routes
# to the controller. Set the controller's public_url to https://ci.example.com
# and NUXT_CLIENT_IP_HEADER=x-forwarded-for for sentinel-web.
#
# Without the web interface, point `proxy_pass` at the controller's api_listen
# (127.0.0.1:7080) and send only the routes listed in docs/deployment.md.
upstream sentinel_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name ci.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ci.example.com;

    ssl_certificate     /etc/ssl/sentinel/fullchain.pem;
    ssl_certificate_key /etc/ssl/sentinel/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:sentinel:10m;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    # The largest body the controller accepts is the GitHub webhook's 4 MiB;
    # it enforces its own per-route limits, this one only bounds the proxy.
    client_max_body_size 4m;

    location / {
        proxy_pass http://sentinel_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite, never append: a client's own X-Forwarded-For must not
        # reach the controller. $remote_addr is the proxy's real peer.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Log following and event streams are long-lived and unbuffered.
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 60s;
    }
}
