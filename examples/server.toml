# Linux controller lifecycle. CLI --data-dir overrides this path.
data_dir = "/var/lib/sentinel"
log_format = "text"
log_level = "info"
# Where workers connect. Loopback by default; exposing it is an explicit decision.
listen = "127.0.0.1:7443"
# Where the API and the page answer. Loopback; put TLS in front to expose it.
api_listen = "127.0.0.1:7080"

# Optional NAT-traversing transport (Q06): the pinned Tailcat helper serves
# only the link port above, to workers admitted by node key. Sentinel still
# authenticates every worker itself; with enabled = false (or no section) the
# link uses direct TLS and nothing below runs. The `tc…` address workers dial
# is written to <data_dir>/tailcat/address (owner-only); treat it as a credential.
# [tailcat]
# enabled = true
# binary = "/usr/local/bin/tailcat"
# sha256 = "d46582137d21f03d15345e2be425d6317d49e5b8c8bb4f6fc56037f4c08cce73"  # pinned v0.6.0
# derpmap_url = "https://derp.example.com/derp.json"  # operator-owned DERP map
# region = "derp.example.com"     # region name in that map; omit to fix a region
# listen_port = 7443              # the link port the helper serves; match `listen`
# Workers are admitted in <data_dir>/tailcat-allow (owner-only), one
# `nodekey:<hex> wrk_<worker id>` per line; a revoked worker's key is dropped
# within 10 s, and an empty list admits no peer. The helper is restarted when
# the admitted set changes.
