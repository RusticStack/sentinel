# Controller configuration for examples/Containerfile.server: the same as
# server.toml, with both listeners on all interfaces of the container so that
# published ports reach them. Mount it read-only at /etc/sentinel/server.toml.
# The host decides who can connect: publish on 127.0.0.1 or a private address.
data_dir = "/var/lib/sentinel"
log_format = "json"
log_level = "info"
listen = "0.0.0.0:7443"
api_listen = "0.0.0.0:7080"
# The public origin: exactly the address the reverse proxy serves, once it
# terminates TLS (docs/deployment.md). Absent, the OAuth issuer and the links the
# controller builds are http://0.0.0.0:7080, which no browser can use.
# public_url = "https://ci.example.com"
# The addresses the controller sees its proxies connect from, as the container
# sees them. This is `web` in compose.server.yaml (its fixed address); without it
# every browser behind `web` shares one rate-limit allowance. Add the proxy's
# network if a proxy container reaches the controller directly. The default is loopback.
trusted_proxies = ["10.89.77.10"]
