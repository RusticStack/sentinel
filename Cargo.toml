[workspace]
members = ["crates/sentinel", "crates/sentinel-auth", "crates/sentinel-core", "crates/sentinel-github", "crates/sentinel-intake", "crates/sentinel-link", "crates/sentinel-store", "crates/sentinel-worker", "crates/sentinel-api", "crates/sentinel-protocol", "crates/sentinel-pipeline", "crates/sentinel-bench", "crates/sentinel-probes"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/RusticStack/sentinel"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
