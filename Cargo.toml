[workspace]
members = ["crates/sentinel", "crates/sentinel-agent", "crates/sentinel-api", "crates/sentinel-auth", "crates/sentinel-bench", "crates/sentinel-cache", "crates/sentinel-checks", "crates/sentinel-core", "crates/sentinel-git", "crates/sentinel-github", "crates/sentinel-intake", "crates/sentinel-link", "crates/sentinel-mail", "crates/sentinel-pipeline", "crates/sentinel-probes", "crates/sentinel-protocol", "crates/sentinel-s3", "crates/sentinel-store", "crates/sentinel-worker"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/RusticStack/sentinel"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Chosen by measurement on the reference host: docs/deployment.md#release-profile,
# bench/v01-release-profile.jsonl. `panic` stays "unwind": the API acceptor, the
# worker executor and the work lanes contain a panic with `catch_unwind`.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"
