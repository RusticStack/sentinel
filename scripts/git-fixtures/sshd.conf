# sshd for the G08 bare-repository fixture. The key is generated on the container's first start
# and pinned by the fixture with ssh-keyscan, the same way any operator pins a host.
Port 22
HostKey /etc/ssh/ssh_host_ed25519_key
PidFile /run/sshd.pid
PermitRootLogin no
PermitEmptyPasswords no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthorizedKeysFile /home/git/.ssh/authorized_keys
AllowUsers git
PrintMotd no
LogLevel ERROR
