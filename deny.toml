# Dependency policy for the release artifacts (docs/releasing.md#dependency-and-license-inventory).
# Checked by `cargo licenses`; the committed inventory is THIRD-PARTY-LICENSES.md,
# regenerated and compared by scripts/release/check-inventory.sh.

[graph]
# Only what the release packages contain: Linux x86_64/arm64 (server, worker,
# CLI), the static musl guest agent and the Windows CLI.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
all-features = true
exclude-dev = true

[licenses]
version = 2
# Permissive licenses only. A dependency under any other license fails the check
# until a person adds it here with a reason.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# Checked by `cargo advisories` (CI on every pull request and daily on main). An
# entry here is an accepted advisory: its reason, and what removes it.
[advisories]
version = 2
yanked = "warn"
ignore = [
    # Bundled SQLite before 3.54.0 can return stale page-cache memory when it opens a
    # database with a crafted `-wal` sibling. The vector is local: the controller opens
    # only databases under its own owner-only data directory, and the host-local
    # `admin backup verify` and `admin restore` open a snapshot from a backup source the
    # operator names, so a source writable by another user can carry a crafted sibling
    # until the upgrade; keep backup sources owner-only. The fix is rusqlite 0.41 or
    # newer (libsqlite3-sys 0.39), a store dependency change that needs the full suite
    # on the verification hosts; remove this entry with that upgrade.
    { id = "RUSTSEC-2026-0459", reason = "local vector: own data directory, plus operator-named backup sources for admin backup verify/restore; fixed by the rusqlite 0.41 upgrade" },
]
