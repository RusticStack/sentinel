# The fleet tests drive a real controller and real worker sessions over sockets, and several of them
# assert on placement and throughput, which other tests sharing the CPU distort. They run one at a
# time; everything else keeps the default parallelism.
[test-groups.fleet]
max-threads = 1

[[profile.default.overrides]]
filter = "package(sentinel-link) and (binary(fleet) or binary(fleet_sessions))"
test-group = "fleet"

# Three binaries assert on wall-clock behaviour rather than only on values: the CLI's clean stop
# inside a deadline, the history routes' p95 latency over ten thousand runs, and an artifact
# publication that waits for its publisher. Fifteen other binaries sharing two cores starve them
# into failing on a saturated box and nowhere else, so they run one binary at a time as well.
[test-groups.timing]
max-threads = 1

[[profile.default.overrides]]
filter = "binary(cli) or binary(history) or binary(digest_first)"
test-group = "timing"
