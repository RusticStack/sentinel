# The fleet tests drive a real controller and real worker sessions over sockets, and several of them
# assert on placement and throughput, which other tests sharing the CPU distort. They run one at a
# time; everything else keeps the default parallelism.
[test-groups.fleet]
max-threads = 1

[[profile.default.overrides]]
filter = "package(sentinel-link) and (binary(fleet) or binary(fleet_sessions))"
test-group = "fleet"

# Four binaries assert on wall-clock behaviour rather than only on values: the CLI's clean stop
# inside a deadline, the history routes' p95 latency over ten thousand runs, an artifact
# publication that waits for its publisher, and a GitHub sign-in that waits out a second-factor
# window. Fifteen other binaries sharing two cores starve them
# into failing on a saturated box and nowhere else, so they run one binary at a time as well.
[test-groups.timing]
max-threads = 1

[[profile.default.overrides]]
filter = "binary(cli) or binary(history) or binary(digest_first) or binary(github_sign_in)"
test-group = "timing"

# The browser scenarios each start a controller, a web server and a Chromium, and one of them holds
# a served fixture open for ten minutes. Run concurrently they starve each other into intermittent
# failures that never reproduce alone, so they run one at a time as well.
[test-groups.browser]
max-threads = 1

[[profile.default.overrides]]
filter = "binary(web_browser)"
test-group = "browser"
